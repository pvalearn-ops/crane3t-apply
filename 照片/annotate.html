<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script src="../shared/case-bridge.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照片尺寸標註</title>
<style>
  :root { --bg: #0f172a; --line: #f59e0b; --pt: #ef4444; --guide: #38bdf8; --ink: #0f172a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; background: #fff; color: var(--ink); }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; }
  .tabs { display: flex; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; }
  .tabs button { border: 0; border-right: 1px solid #cbd5e1; background: #fff; padding: 7px 12px; font: inherit; cursor: pointer; }
  .tabs button:last-child { border-right: 0; }
  .tabs button.on { background: #1d4ed8; color: #fff; font-weight: 700; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }
  .tools button { border: 1px solid #cbd5e1; background: #fff; border-radius: 7px; padding: 6px 10px; font: inherit; font-size: 14px; cursor: pointer; }
  .tools button:hover { background: #eff6ff; }
  .tools button.danger { color: #b91c1c; border-color: #fecaca; }
  .tools label { font-size: 14px; display: flex; align-items: center; gap: 4px; }
  .hint { padding: 5px 12px; font-size: 13px; color: #475569; background: #fffbeb; border-bottom: 1px solid #fde68a; }
  #stage { position: relative; flex: 1; background: var(--bg); overflow: hidden; touch-action: none; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #cv.dragging { cursor: grabbing; }
  #empty { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: rgba(255,255,255,.92); color: #b45309; padding: 6px 12px; border-radius: 8px; font-size: 14px; display: none; }
  #editBox { position: absolute; display: none; z-index: 5; }
  #editBox input { font: inherit; font-size: 15px; padding: 4px 6px; border: 2px solid #1d4ed8; border-radius: 6px; min-width: 260px; }
</style>
</head>
<body>
  <div class="bar">
    <div class="tabs" id="tabs">
      <button data-step="1">① 正面照</button><button data-step="2">② 側面照</button><button data-step="3">③ 伸臂全伸照</button>
    </div>
    <div class="tools">
      <button id="zoomIn" title="放大">＋ 放大</button>
      <button id="zoomOut" title="縮小">－ 縮小</button>
      <button id="fit" title="照片符合畫面">⤢ 符合畫面</button>
      <button id="addAnn" title="新增一條標註線">＋ 新增標註</button>
      <button id="delAnn" class="danger" title="刪除選取的標註">🗑 刪除選取</button>
      <label><input type="checkbox" id="guides" checked> 輔助線</label>
      <button id="reset" class="danger" title="恢復本張照片的預設標註與位置">↺ 恢復預設</button>
    </div>
  </div>
  <div class="hint">標註線一律水平；拖曳<b>紅色端點</b>調整長度與高度；拖曳<b>標註線或文字</b>可整條移動；<b>雙擊文字</b>可修改內容；滑鼠滾輪或「放大／縮小」縮放照片，拖曳照片空白處可移動照片。變更會自動儲存。</div>
  <div id="stage"><canvas id="cv"></canvas><div id="empty">尚未上傳此照片，請先在 S5 上傳；目前僅顯示標註線架構。</div><div id="editBox"><input id="editInput"></div></div>

<script>
(function () {
  const KEY = 'photo_annot_v2', DEF_KEY = 'photo_defaults';
  const qs = new URLSearchParams(location.search);
  const RENDER_ONLY = qs.get('render') === 'all';
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), stage = document.getElementById('stage');
  const read = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const defs = read(DEF_KEY) || {};
  const saved = read(KEY) || {};
  const S = { step: Math.min(3, Math.max(1, +qs.get('step') || 1)), img: {}, ann: saved.ann || {}, view: { s: 1, x: 0, y: 0 }, sel: null, drag: null };
  const PH = { w: 1600, h: 1200 };   // 無照片時的版面

  /* ---------- 預設標註（文字由 S2 數值產生） ---------- */
  const fmt = (v) => (v == null || v === '' || isNaN(v)) ? '—' : Number(v).toLocaleString('en-US');
  function autoText(key) {
    if (key === 'W') return '撐腳寬度 W = ' + fmt(defs.w) + ' mm';
    if (key === 'S') return '前輪中心至旋轉中心 S = ' + fmt(defs.s) + ' mm';
    if (key === 'WB') return '軸距 = ' + fmt(defs.wb) + ' mm';
    if (key === 'TOTAL') return '伸臂全伸長度 = ' + fmt((defs.sections || []).reduce((a, b) => a + b, 0)) + ' mm';
    const m = /^SEC(\d+)$/.exec(key || '');
    if (m) return '第 ' + (+m[1] + 1) + ' 節 ' + fmt((defs.sections || [])[+m[1]]) + ' mm';
    return '';
  }
  function defaultAnn(step) {
    const A = (x1, y1, x2, y2, auto) => ({ p1: { x: x1, y: y1 }, p2: { x: x2, y: y2 }, auto, text: autoText(auto) });
    if (step === 1) return [A(0.16, 0.84, 0.84, 0.84, 'W')];
    if (step === 2) return [A(0.20, 0.80, 0.38, 0.80, 'S'), A(0.20, 0.90, 0.72, 0.90, 'WB')];
    return [A(0.10, 0.45, 0.90, 0.45, 'TOTAL')];   // 伸臂全伸只標一條總長
  }
  function annOf(step) {
    if (!Array.isArray(S.ann[step]) || !S.ann[step].length) S.ann[step] = defaultAnn(step);
    // 舊版的伸臂各節標註改為單一全伸標註
    if (step === 3 && S.ann[3].some(a => /^SEC/.test(a.auto || ''))) S.ann[3] = defaultAnn(3);
    // 標註線一律水平
    S.ann[step].forEach(a => { if (a.p2.y !== a.p1.y) a.p2.y = a.p1.y; });
    // 自動文字：依目前 S2 數值更新（使用者改過文字者不變）
    S.ann[step].forEach(a => { if (a.auto) a.text = autoText(a.auto); });
    return S.ann[step];
  }

  /* ---------- 照片 ---------- */
  async function loadImg(step) {
    if (S.img[step] !== undefined) return S.img[step];
    S.img[step] = null;
    try {
      const rec = window.CaseFiles ? await window.CaseFiles.get('photo' + step) : null;
      if (rec && rec.dataUrl) S.img[step] = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = rec.dataUrl; });
    } catch (e) {}
    return S.img[step];
  }
  const dims = () => { const im = S.img[S.step]; return im ? { w: im.naturalWidth, h: im.naturalHeight } : PH; };

  /* ---------- 檢視變換 ---------- */
  function resize() {
    const r = stage.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function fit() {
    const r = stage.getBoundingClientRect(), d = dims();
    const s = Math.min(r.width / d.w, r.height / d.h) * 0.94;
    S.view = { s, x: (r.width - d.w * s) / 2, y: (r.height - d.h * s) / 2 };
  }
  const toScr = (p) => { const d = dims(); return { x: S.view.x + p.x * d.w * S.view.s, y: S.view.y + p.y * d.h * S.view.s }; };
  const toImg = (x, y) => { const d = dims(); return { x: (x - S.view.x) / (d.w * S.view.s), y: (y - S.view.y) / (d.h * S.view.s) }; };

  /* ---------- 繪圖（畫面與輸出共用） ---------- */
  function drawArrow(c, x1, y1, x2, y2, size) {
    const a = Math.atan2(y2 - y1, x2 - x1);
    c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - size * Math.cos(a - 0.4), y2 - size * Math.sin(a - 0.4)); c.lineTo(x2 - size * Math.cos(a + 0.4), y2 - size * Math.sin(a + 0.4)); c.closePath(); c.fill();
  }
  function labelRect(c, a, P1, P2, fs) {
    c.font = '700 ' + fs + 'px "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
    const w = c.measureText(a.text || ' ').width + fs * 0.8, h = fs * 1.5;
    const mx = (P1.x + P2.x) / 2, my = (P1.y + P2.y) / 2 - h * 0.9;
    return { x: mx - w / 2, y: my - h / 2, w, h, cx: mx, cy: my };
  }
  function drawAnn(c, a, P1, P2, k, selected, showPts) {
    c.save();
    c.lineWidth = 3 * k; c.strokeStyle = c.fillStyle = selected ? '#fde047' : '#f59e0b';
    c.beginPath(); c.moveTo(P1.x, P1.y); c.lineTo(P2.x, P2.y); c.stroke();
    drawArrow(c, P2.x, P2.y, P1.x, P1.y, 14 * k); drawArrow(c, P1.x, P1.y, P2.x, P2.y, 14 * k);
    // 端點引線
    c.lineWidth = 1.5 * k; c.setLineDash([5 * k, 4 * k]);
    [P1, P2].forEach(P => { c.beginPath(); c.moveTo(P.x, P.y - 22 * k); c.lineTo(P.x, P.y + 22 * k); c.stroke(); });
    c.setLineDash([]);
    if (showPts) [P1, P2].forEach(P => { c.fillStyle = '#ef4444'; c.beginPath(); c.arc(P.x, P.y, 8 * k, 0, Math.PI * 2); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2 * k; c.stroke(); });
    const R = labelRect(c, a, P1, P2, 17 * k);
    c.fillStyle = 'rgba(15,23,42,.88)'; c.strokeStyle = selected ? '#fde047' : '#f59e0b'; c.lineWidth = 2 * k;
    c.beginPath(); if (c.roundRect) c.roundRect(R.x, R.y, R.w, R.h, 6 * k); else c.rect(R.x, R.y, R.w, R.h); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(a.text || '', R.cx, R.cy + 1);
    c.restore();
    return R;
  }
  function drawGuides(c, x, y, w, h, k) {
    c.save(); c.strokeStyle = 'rgba(56,189,248,.85)'; c.fillStyle = 'rgba(56,189,248,.95)'; c.lineWidth = 1.5 * k; c.setLineDash([8 * k, 6 * k]);
    c.font = (13 * k) + 'px "Microsoft JhengHei",sans-serif';
    const gy = y + h * (S.step === 3 ? 0.88 : 0.86);
    c.beginPath(); c.moveTo(x, gy); c.lineTo(x + w, gy); c.stroke(); c.fillText('地面基準線', x + 8 * k, gy - 6 * k);
    if (S.step === 1) {
      c.beginPath(); c.moveTo(x + w / 2, y); c.lineTo(x + w / 2, y + h); c.stroke(); c.fillText('車輛中心線', x + w / 2 + 6 * k, y + 18 * k);
      c.strokeRect(x + w * 0.32, y + h * 0.30, w * 0.36, h * 0.52); c.fillText('車頭置中框', x + w * 0.32 + 6 * k, y + h * 0.30 + 16 * k);
    } else if (S.step === 2) {
      c.beginPath(); c.moveTo(x + w * 0.20, y + h * 0.35); c.lineTo(x + w * 0.20, gy); c.stroke(); c.fillText('前輪中心', x + w * 0.20 + 6 * k, y + h * 0.35);
      c.beginPath(); c.moveTo(x + w * 0.38, y + h * 0.20); c.lineTo(x + w * 0.38, gy); c.stroke(); c.fillText('旋轉中心', x + w * 0.38 + 6 * k, y + h * 0.20);
    } else {
      c.beginPath(); c.moveTo(x, y + h * 0.45); c.lineTo(x + w, y + h * 0.45); c.stroke(); c.fillText('伸臂水平基準', x + 8 * k, y + h * 0.45 - 6 * k);
    }
    c.restore();
  }
  let rects = [];
  function draw() {
    const r = stage.getBoundingClientRect(), d = dims(), im = S.img[S.step];
    ctx.clearRect(0, 0, r.width, r.height);
    const w = d.w * S.view.s, h = d.h * S.view.s;
    if (im) ctx.drawImage(im, S.view.x, S.view.y, w, h);
    else { ctx.fillStyle = '#1e293b'; ctx.fillRect(S.view.x, S.view.y, w, h); }
    if (document.getElementById('guides').checked) drawGuides(ctx, S.view.x, S.view.y, w, h, 1);
    rects = annOf(S.step).map((a, i) => drawAnn(ctx, a, toScr(a.p1), toScr(a.p2), 1, S.sel === i, true));
    document.getElementById('empty').style.display = im ? 'none' : 'block';
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', +b.dataset.step === S.step));
  }

  /* ---------- 輸出標註圖（供 PDF） ---------- */
  function renderAnnotated(step) {
    const im = S.img[step]; if (!im) return null;
    // 輸出寬度固定在 1400～2000px（小照片放大），文字比例與編輯畫面一致
    const nw = im.naturalWidth, nh = im.naturalHeight, tw = Math.min(2000, Math.max(1400, nw));
    const W = Math.round(tw), H = Math.round(nh * tw / nw);
    const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
    g.drawImage(im, 0, 0, W, H);
    const k = W / 900;
    annOf(step).forEach(a => drawAnn(g, a, { x: a.p1.x * W, y: a.p1.y * H }, { x: a.p2.x * W, y: a.p2.y * H }, k, false, false));
    return c.toDataURL('image/jpeg', 0.88);
  }

  /* ---------- 儲存 ---------- */
  let tSave = null;
  function save() {
    clearTimeout(tSave);
    tSave = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify({ ann: S.ann, savedAt: new Date().toISOString() })); } catch (e) {}
      const url = renderAnnotated(S.step);
      if (url && window.CaseFiles) window.CaseFiles.put('annot' + S.step, '標註照片' + S.step + '.jpg', 'image/jpeg', url).catch(() => {});
    }, 400);
  }

  /* ---------- 操作 ---------- */
  const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  function hit(p) {
    const list = annOf(S.step);
    for (let i = list.length - 1; i >= 0; i--) {
      const a = list[i], P1 = toScr(a.p1), P2 = toScr(a.p2);
      if (Math.hypot(p.x - P1.x, p.y - P1.y) < 13) return { i, part: 'p1' };
      if (Math.hypot(p.x - P2.x, p.y - P2.y) < 13) return { i, part: 'p2' };
    }
    for (let i = list.length - 1; i >= 0; i--) {
      const R = rects[i]; if (R && p.x >= R.x && p.x <= R.x + R.w && p.y >= R.y && p.y <= R.y + R.h) return { i, part: 'label' };
      const a = list[i], P1 = toScr(a.p1), P2 = toScr(a.p2), L = Math.hypot(P2.x - P1.x, P2.y - P1.y) || 1;
      const t = Math.max(0, Math.min(1, ((p.x - P1.x) * (P2.x - P1.x) + (p.y - P1.y) * (P2.y - P1.y)) / (L * L)));
      if (Math.hypot(p.x - (P1.x + t * (P2.x - P1.x)), p.y - (P1.y + t * (P2.y - P1.y))) < 8) return { i, part: 'line' };
    }
    return null;
  }
  cv.addEventListener('pointerdown', (e) => {
    hideEdit();
    const p = pos(e), h = hit(p); cv.setPointerCapture(e.pointerId); cv.classList.add('dragging');
    if (h) { S.sel = h.i; const a = annOf(S.step)[h.i]; S.drag = { kind: h.part, start: p, p1: { ...a.p1 }, p2: { ...a.p2 } }; }
    else { S.sel = null; S.drag = { kind: 'pan', start: p, vx: S.view.x, vy: S.view.y }; }
    draw();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!S.drag) { const h = hit(pos(e)); cv.style.cursor = h ? (h.part === 'p1' || h.part === 'p2' ? 'crosshair' : 'move') : 'grab'; return; }
    const p = pos(e), D = S.drag;
    if (D.kind === 'pan') { S.view.x = D.vx + p.x - D.start.x; S.view.y = D.vy + p.y - D.start.y; }
    else {
      const a = annOf(S.step)[S.sel], d = dims(), dx = (p.x - D.start.x) / (d.w * S.view.s), dy = (p.y - D.start.y) / (d.h * S.view.s);
      // 標註線維持水平：拖端點時左右移動該端點、上下移動整條線
      if (D.kind === 'p1') { a.p1 = { x: D.p1.x + dx, y: D.p1.y + dy }; a.p2 = { x: D.p2.x, y: D.p1.y + dy }; }
      else if (D.kind === 'p2') { a.p2 = { x: D.p2.x + dx, y: D.p2.y + dy }; a.p1 = { x: D.p1.x, y: D.p2.y + dy }; }
      else { a.p1 = { x: D.p1.x + dx, y: D.p1.y + dy }; a.p2 = { x: D.p2.x + dx, y: D.p2.y + dy }; }
      D.moved = true;
    }
    draw();
  });
  const up = () => { if (S.drag && S.drag.moved) save(); S.drag = null; cv.classList.remove('dragging'); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(pos(e), e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
  function zoomAt(p, f) {
    const s2 = Math.min(20, Math.max(0.05, S.view.s * f)), r = s2 / S.view.s;
    S.view = { s: s2, x: p.x - (p.x - S.view.x) * r, y: p.y - (p.y - S.view.y) * r }; draw();
  }
  const center = () => { const r = stage.getBoundingClientRect(); return { x: r.width / 2, y: r.height / 2 }; };
  document.getElementById('zoomIn').onclick = () => zoomAt(center(), 1.25);
  document.getElementById('zoomOut').onclick = () => zoomAt(center(), 1 / 1.25);
  document.getElementById('fit').onclick = () => { fit(); draw(); };
  document.getElementById('guides').onchange = draw;

  // 雙擊文字：直接修改標註內容
  const editBox = document.getElementById('editBox'), editInput = document.getElementById('editInput');
  let editIdx = null;
  function hideEdit(commit) {
    if (editIdx == null) return;
    if (commit) { const a = annOf(S.step)[editIdx]; const v = editInput.value.trim(); if (v && v !== a.text) { a.text = v; a.auto = null; save(); } }
    editIdx = null; editBox.style.display = 'none'; draw();
  }
  cv.addEventListener('dblclick', (e) => {
    const h = hit(pos(e)); if (!h) return;
    const R = rects[h.i]; editIdx = h.i; S.sel = h.i;
    editInput.value = annOf(S.step)[h.i].text || '';
    editBox.style.left = Math.max(4, R.x) + 'px'; editBox.style.top = Math.max(4, R.y) + 'px'; editBox.style.display = 'block';
    editInput.focus(); editInput.select();
  });
  editInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') hideEdit(true); if (e.key === 'Escape') hideEdit(false); });
  editInput.addEventListener('blur', () => hideEdit(true));

  document.getElementById('addAnn').onclick = () => {
    const c = toImg(center().x, center().y);
    annOf(S.step).push({ p1: { x: c.x - 0.15, y: c.y }, p2: { x: c.x + 0.15, y: c.y }, auto: null, text: '標註（雙擊修改文字）' });
    S.sel = annOf(S.step).length - 1; save(); draw();
  };
  document.getElementById('delAnn').onclick = () => {
    if (S.sel == null) return alert('請先點選要刪除的標註線。');
    annOf(S.step).splice(S.sel, 1); S.sel = null; save(); draw();
  };
  document.getElementById('reset').onclick = () => {
    if (!confirm('恢復本張照片的預設標註（位置與文字），並讓照片符合畫面？')) return;
    S.ann[S.step] = defaultAnn(S.step); S.sel = null; fit(); save(); draw();
  };
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = async () => {
    hideEdit(true); S.step = +b.dataset.step; S.sel = null; await loadImg(S.step); fit(); draw();
  });
  window.addEventListener('resize', () => { resize(); fit(); draw(); });

  /* ---------- 啟動 ---------- */
  async function init() {
    if (RENDER_ONLY) {   // 供產出 PDF：輸出三張標註圖
      const out = {};
      for (const st of [1, 2, 3]) { await loadImg(st); out[st] = { url: renderAnnotated(st), texts: annOf(st).map(a => a.text) }; }
      window.__annotOut = out; window.__annotDone = true; return;
    }
    await loadImg(S.step); resize(); fit(); draw();
    [1, 2, 3].filter(s => s !== S.step).forEach(s => loadImg(s));
  }
  window.__annotState = S;   // 供除錯／測試
  init();
})();
</script>
</body>
</html>
